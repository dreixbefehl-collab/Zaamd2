name: Build Zaamd APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unpack Zaamd
        run: |
          rm -rf zaamd_src zaamd_source
          mkdir zaamd_source
          unzip -o Zaamd_Clean_Rebuild.zip -d zaamd_source

      - name: Create Android project
        run: flutter create zaamd_src --platforms=android --project-name=zaamd --org=com.zaamd

      - name: Put Zaamd code and assets back
        run: |
          cp zaamd_source/Zaamd_Clean_Rebuild/pubspec.yaml zaamd_src/pubspec.yaml
          cp zaamd_source/Zaamd_Clean_Rebuild/lib/main.dart zaamd_src/lib/main.dart
          cp -R zaamd_source/Zaamd_Clean_Rebuild/assets zaamd_src/assets

      - name: Build APK
        working-directory: zaamd_src
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaamd-Android-debug
          path: zaamd_src/build/app/outputs/flutter-apk/app-debug.apk
