name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip game source
        run: |
          unzip -o Zaamd_Clean_Rebuild.zip -d game
          cp -r game/Zaamd_Clean_Rebuild/. .
          rm -rf game

      - name: Create Android files
        run: flutter create --platforms=android --org com.dreixbefehl --project-name zaamd .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAAMD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZAAMD_KEYSTORE_PASSWORD }}
        run: |
          set -e
          umask 077
          KEYSTORE="$RUNNER_TEMP/zaamd-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias zaamd --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaamd-APK
          path: build/app/outputs/flutter-apk/app-release.apk
